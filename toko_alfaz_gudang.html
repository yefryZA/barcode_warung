// LOGIKA DATABASE (KHUSUS STOK MASUK & DAFTAR BARU)
async function prosesBarang(barcode, mode) {
    const { ref, get, set, update } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js");
    const barangRef = ref(db, `stok_barang/${barcode}`);
    const snapshot = await get(barangRef);
    const data = snapshot.val();

    if (data) {
        // --- MODE TAMBAH STOK GUDANG ---
        if (mode === 'masuk') {
            const labelSatuan = data.satuan || 'Pcs';
            let qty = prompt(`TAMBAH STOK: ${data.nama}\nStok Sekarang: ${data.stok} ${labelSatuan}\n\nMasukkan Jumlah Baru:`, "1");
            
            if (qty && !isNaN(qty)) {
                // Pakai parseFloat supaya kalau nambah stok timbangan (misal 1.5kg) tidak error
                const stokBaru = parseFloat(data.stok) + parseFloat(qty);
                await update(barangRef, { stok: stokBaru });
                alert(`Stok ${data.nama} Berhasil Diupdate ke ${stokBaru} ${labelSatuan}!`);
            }
        }
    } else {
        // --- MODE DAFTAR BARANG BARU ---
        alert("BARANG BARU TERDETEKSI!\nSilahkan lengkapi data.");
        
        let nama = prompt("Nama Barang:");
        
        // Tambahan Pertanyaan Satuan
        let pilihanSatuan = prompt("PILIH SATUAN:\n1. PCS (Bijian)\n2. KG (Timbangan)\n\nKetik angka 1 atau 2:", "1");
        let satuan = (pilihanSatuan === "2") ? "Kg" : "Pcs";
        
        let hBeli = prompt("Harga Modal / Beli (Rp):", "0");
        let hJual = prompt("Harga Jual (Rp):", "0");
        let stokAwal = prompt(`Stok Awal (${satuan}):`, "1");
        let limit = prompt("Peringatan Stok Menipis di angka:", "5");

        if (nama && hBeli && hJual) {
            await set(barangRef, {
                nama: nama.toUpperCase(),
                satuan: satuan, // Menyimpan info satuan
                hargaBeli: parseInt(hBeli),
                hargaJual: parseInt(hJual),
                // Gunakan parseFloat agar stok bisa simpan angka desimal (0.5, 1.25 dll)
                stok: parseFloat(stokAwal),
                minStok: parseFloat(limit),
                terjual: 0
            });
            alert(`Berhasil! ${nama.toUpperCase()} terdaftar sebagai satuan ${satuan}.`);
        }
    }
}

// --- FUNGSI EDIT BARANG (VERSI FIXED) ---
window.editBarang = async function(barcode) {
     const { ref, get, update, remove } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js");
    
    try {
        const bRef = ref(window.db || db, `stok_barang/${barcode}`);
        const snapshot = await get(bRef);
        const item = snapshot.val();

        if (!item) {
            alert("Data tidak ditemukan!");
            return;
        }

        const menu = prompt(
            `EDIT BARANG: ${item.nama}\n\n` +
            `1. Ubah Harga Jual (Rp ${item.hargaJual})\n` +
            `2. Ubah Harga Modal (Rp ${item.hargaBeli || 0})\n` +
            `3. Koreksi Stok (${item.stok})\n` +
            `4. Hapus Barang\n\n` +
            `Pilih nomor (1-4):`
        );

        if (menu === "1") {
            let nHarga = prompt("Harga Jual Baru:", item.hargaJual);
            if(nHarga) await update(bRef, { hargaJual: parseInt(nHarga) });
        } else if (menu === "2") {
            let nModal = prompt("Harga Modal Baru:", item.hargaBeli || 0);
            if(nModal) await update(bRef, { hargaBeli: parseInt(nModal) });
        } else if (menu === "3") {
            let nStok = prompt("Koreksi Stok Jadi:", item.stok);
            if(nStok) await update(bRef, { stok: parseFloat(nStok) }); // Pakai Float biar bisa desimal
        } else if (menu === "4") {
            if(confirm(`Hapus ${item.nama}?`)) await remove(bRef);
        }
    } catch (err) {
        console.error(err);
        alert("Gagal ambil data. Pastikan koneksi aman!");
    }
};

onValue(ref(db, 'stok_barang'), (snapshot) => {
    const data = snapshot.val();
    const tableBody = document.getElementById('tabel-body');
    const totalAsetEl = document.getElementById('total-aset-display');
    const stokTipisEl = document.getElementById('stok-tipis-display');
    
    if (!tableBody) return;
    tableBody.innerHTML = ""; 

    // Variabel untuk hitung dashboard
    let totalAset = 0;
    let jumlahTipis = 0;

    if (data) {
        Object.keys(data).forEach(key => {
            const item = data[key];

            // 1. HITUNG ASET (Stok * Harga Beli)
            // Pakai hargaBeli supaya tahu modal yang mengendap
            totalAset += (parseFloat(item.stok) || 0) * (parseInt(item.hargaBeli) || 0);

            // 2. HITUNG STOK TIPIS (Batas 5)
            if (parseFloat(item.stok) <= 5) {
                jumlahTipis++;
            }

            // 3. RENDER TABEL
            const row = `
                <tr class="border-b border-white/5">
                    <td class="p-3">
                        <span class="block font-bold text-white">${item.nama}</span>
                        <span class="text-[9px] text-gray-500">${key}</span>
                    </td>
                    <td class="p-3 text-center">
                        <span class="px-2 py-1 rounded ${parseFloat(item.stok) <= 5 ? 'bg-red-500/20 text-red-500' : 'text-white'}">
                            ${item.stok}
                        </span>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="window.editBarang('${key}')" style="background:#D4AF37; color:black; padding:5px 10px; border-radius:5px; font-weight:bold; font-size:10px;">
                            EDIT
                        </button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    } else {
        tableBody.innerHTML = "<tr><td colspan='3' class='text-center p-5 text-gray-500'>Data Kosong</td></tr>";
    }

    // 4. UPDATE ANGKA DASHBOARD
    if (totalAsetEl) totalAsetEl.innerText = "Rp " + totalAset.toLocaleString();
    if (stokTipisEl) stokTipisEl.innerText = jumlahTipis + " Item";
});

// --- FUNGSI CARI BARANG ---
window.filterBarang = function() {
    let input = document.getElementById("cariBarang").value.toUpperCase();
    let table = document.getElementById("tabel-body");
    let tr = table.getElementsByTagName("tr");

    for (let i = 0; i < tr.length; i++) {
        let td = tr[i].getElementsByTagName("td")[0];
        if (td) {
            let txtValue = td.textContent || td.innerText;
            if (txtValue.toUpperCase().indexOf(input) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }
}

// --- FUNGSI EXPORT KE PDF + RESET HARIAN ---
window.downloadPDF = async function() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // 1. Ambil data dari Firebase
    const dbRef = ref(db, 'stok_barang');
    const snapshot = await get(dbRef);
    const data = snapshot.val();

    if (!data) {
        alert("Belum ada data barang, Bang!");
        return;
    }

    // 2. Header Laporan
    doc.setFontSize(16);
    doc.setTextColor(212, 175, 55); // Warna Emas BBS
    doc.text("LAPORAN PENJUALAN HARIAN TOKO ALKAZ", 14, 20);
    
    doc.setFontSize(10);
    doc.setTextColor(100);
    const tgl = new Date();
    const tglFormat = tgl.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    doc.text(`Tanggal: ${tglFormat}`, 14, 28);
    doc.line(14, 32, 196, 32);

    // 3. Filter & Susun Data (Hanya yang terjual)
    const rows = [];
    let totalUangMasuk = 0;

    Object.keys(data).forEach((barcode) => {
        const item = data[barcode];
        if (item.terjual && item.terjual > 0) { 
            const subTotal = item.terjual * item.hargaJual;
            totalUangMasuk += subTotal;

            rows.push([
                item.nama,
                item.terjual,
                `Rp ${item.hargaJual.toLocaleString()}`,
                item.stok 
            ]);
        }
    });

    if (rows.length === 0) {
        alert("Hari ini belum ada barang yang terjual, Bang. Semangat jualannya!");
        return;
    }

    // 4. Gambar Tabel
    doc.autoTable({
        startY: 38,
        head: [['Nama Barang', 'Terjual', 'Harga', 'Sisa Stok']],
        body: rows,
        headStyles: { fillColor: [212, 175, 55], textColor: [0, 0, 0], fontStyle: 'bold' },
        columnStyles: {
            1: { halign: 'center' }, 
            2: { halign: 'right' },  
            3: { halign: 'center' }  
        },
        styles: { fontSize: 9 }
    });

    // 5. Total Uang Masuk
    const finalY = doc.lastAutoTable.finalY + 15;
    doc.setFontSize(14);
    doc.setTextColor(0);
    doc.setFont(undefined, 'bold');
    doc.text(`TOTAL UANG MASUK HARI INI:`, 14, finalY);
    
    doc.setTextColor(34, 197, 94); // Warna Hijau Duit
    doc.text(`Rp ${totalUangMasuk.toLocaleString()}`, 14, finalY + 8);

    // 6. Footer
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text("Dokumen ini dihasilkan otomatis oleh BBS Gold Inventory System", 14, 285);

    // 7. Simpan File PDF
    doc.save(`Sales_Report_BBS_${new Date().toISOString().split('T')[0]}.pdf`);

    setTimeout(async () => {
        const yakinReset = confirm("Laporan PDF sudah ter-download.\n\nApakah Abang ingin RESET angka terjual saja?\n(Data stok dan aset tetap aman)");
        
        if (yakinReset) {
            try {
                // Ambil referensi langsung ke folder stok_barang
                const updates = {};
                Object.keys(data).forEach((barcode) => {
                    const itemRef = ref(db, `stok_barang/${barcode}`);
                    update(itemRef, { terjual: 0 });
                });
                
                alert("BERHASIL! Angka terjual kembali ke Nol. Data aset dan stok tetap aman.");
                location.reload(); // Refresh biar angka di dashboard update
            } catch (error) {
                alert("Gagal reset data: " + error);
            }
        }
    }, 1500);
}

window.mulaiAplikasi = function() {

    let elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { /* Safari */
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) { /* IE11 */
        elem.msRequestFullscreen();
    }

    // 2. Hilangkan Welcome Screen dengan efek fade out
    const welcome = document.getElementById('welcome-screen');
    welcome.style.opacity = '0';
    setTimeout(() => {
        welcome.style.display = 'none';
    }, 1000);
}
// --- HITUNG OMZET & MARGIN HARI INI ---
const tglSekarang = new Date().toISOString().split('T')[0];

onValue(ref(db, 'laporan_penjualan'), (snapshot) => {
    let omzet = 0;
    let margin = 0;
    const data = snapshot.val();
    const tglSekarang = new Date().toISOString().split('T')[0];

    if (data) {
        Object.values(data).forEach(trx => {
            if (trx.tanggal === tglSekarang) {
                // Tambahkan Omzet
                omzet += (trx.totalHarga || 0);

                // Hitung Margin per Item
                if (trx.items && Array.isArray(trx.items)) {
                    trx.items.forEach(item => {
                        // Pakai item.qty karena di kasir kita simpan dengan nama 'qty'
                        const q = parseFloat(item.qty) || 0;
                        const hJual = parseFloat(item.hargaJual) || 0;
                        const hBeli = parseFloat(item.hargaBeli) || 0;

                        const untung = (hJual - hBeli) * q;
                        margin += untung;
                    });
                }
            }
        });
    }

    // Tampilkan ke layar (Gunakan Math.round agar tidak ada koma di rupiah)
    document.getElementById('total-masuk-display').innerText = "Rp " + Math.round(omzet).toLocaleString();
    document.getElementById('total-margin-display').innerText = "Rp " + Math.round(margin).toLocaleString();
});

window.tambahKeKeranjang = async function(id) {
    const { ref, get } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js");
    const barangRef = ref(db, `stok_barang/${id}`);
    const snapshot = await get(barangRef);
    const item = snapshot.val();

    if (!item) return alert("Barang tidak ditemukan!");

    let qtyFix = 1;
    let hargaFix = item.hargaJual;

    if (item.satuan === "Kg") {
        // Minta input Rupiah kalau barangnya Kg
        let nominal = prompt(`BELI ${item.nama}\nHarga per Kg: Rp ${item.hargaJual.toLocaleString()}\n\nBeli berapa Rupiah?`, "10000");
        
        if (nominal === null || nominal === "") return; // Batal jika user klik cancel
        
        let rp = parseFloat(nominal);
        // RUMUS: Rupiah dibagi Harga per Kg = Berat yang didapat
        qtyFix = rp / item.hargaJual; 
        hargaFix = item.hargaJual;
    }

    // Cek apakah barang sudah ada di keranjang, kalau ada kita tambah qty-nya
    const index = keranjang.findIndex(i => i.id === id);
    if (index > -1) {
        keranjang[index].qty += qtyFix;
    } else {
        keranjang.push({
            id: id,
            nama: item.nama,
            qty: qtyFix,
            harga: hargaFix, // Ini harga per satuan (Pcs atau Kg)
            hargaBeli: item.hargaBeli || 0,
            satuan: item.satuan || "Pcs"
        });
    }

    updateTampilanKeranjang();
};

</script>
